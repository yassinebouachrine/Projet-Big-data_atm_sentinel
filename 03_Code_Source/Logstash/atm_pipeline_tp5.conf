input {
  file {
    path => "/data/atm/atm_transactions.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
  }
}
filter {
  csv {
    separator => ","
    columns => ["transaction_id","start_time","end_time","duration_sec","cardholder_id","atm_id","location_name","city","state","transaction_type_id","transaction_type","amount","account_type","occupation","gender","is_holiday"]
  }
  ruby {
    path => "/usr/share/logstash/pipeline/validate_atm_tp5.rb"
  }
}
output {
  if [status] == "VALID" {
    elasticsearch {
      hosts => ["https://192.168.1.138:9200", "https://192.168.1.113:9200", "https://192.168.1.127:9200"]
      index => "atm-transactions-tp5"
      document_id => "%{transaction_id}"
      user => "elastic"
      password => "${ES_PWD}"
      ssl => true
      ssl_certificate_verification => false
    }
  } else {
    elasticsearch {
      hosts => ["https://192.168.1.138:9200", "https://192.168.1.113:9200", "https://192.168.1.127:9200"]
      index => "atm-rejects-tp5"
      document_id => "%{transaction_id}"
      user => "elastic"
      password => "${ES_PWD}"
      ssl => true
      ssl_certificate_verification => false
    }
  }
}
